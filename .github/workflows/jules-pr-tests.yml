name: Jules PR Smoke Tests
# VibecOPS — Authorized account: daniel.trejo.eclectic@gmail.com

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.labels.*.name, 'jules') ||
      contains(github.event.pull_request.labels.*.name, 'auto-merge') ||
      github.event.pull_request.user.login == 'google-labs-jules'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate
        run: echo "Smoke tests complete"
      - uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const s = '${{ job.status }}';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: `${s === 'success' ? '✅' : '⚠️'} Jules Smoke: ${s} | Account: daniel.trejo.eclectic@gmail.com`,
            });
